<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>SkillHUD</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden}

:root{
  --bg-window:#F4F5F7;
  --bg-panel:#FFFFFF;
  --text-primary:#16181D;
  --text-secondary:#5B616E;
  --text-tertiary:#8A909C;
  --accent:#3D6BFF;
  --accent-bg:rgba(61,107,255,.10);
  --success:#12A150;
  --success-bg:rgba(18,161,80,.12);
  --border:rgba(16,18,29,.08);
  --border-strong:rgba(16,18,29,.12);
  --hover-shadow:0 2px 8px rgba(16,18,29,.08);
}
[data-theme="dark"]{
  --bg-window:#101216;
  --bg-panel:#1B1E24;
  --text-primary:#E8EAEE;
  --text-secondary:#A6ADBB;
  --text-tertiary:#767D8A;
  --accent:#6E8BFF;
  --accent-bg:rgba(110,139,255,.14);
  --success:#12A150;
  --success-bg:rgba(18,161,80,.15);
  --border:rgba(255,255,255,.08);
  --border-strong:rgba(255,255,255,.12);
  --hover-shadow:0 2px 8px rgba(0,0,0,.35);
}

body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  background:var(--bg-window);color:var(--text-primary);
  display:flex;height:100%;
}

/* ===== 容器 ===== */
.app{flex:1;display:flex;flex-direction:column;margin:0;background:var(--bg-panel);overflow:hidden}

/* ===== 顶栏 ===== */
.bar{
  height:34px;flex-shrink:0;
  display:flex;align-items:center;padding:0 8px 0 12px;gap:6px;
  border-bottom:1px solid var(--border);
  background:var(--bg-panel);
  -webkit-app-region:drag;
}
.bar-logo{color:var(--accent);flex-shrink:0}
.bar-title{flex:1;font-weight:600;font-size:12.5px;color:var(--text-primary);letter-spacing:-.01em}
.bar-btns{display:flex;gap:2px;-webkit-app-region:no-drag}
.bar-btn{
  width:26px;height:26px;border:none;background:transparent;
  border-radius:8px;cursor:pointer;color:var(--text-tertiary);
  display:flex;align-items:center;justify-content:center;transition:.12s;
}
.bar-btn:hover{background:rgba(16,18,29,.06);color:var(--text-primary)}
[data-theme="dark"] .bar-btn:hover{background:rgba(255,255,255,.08)}
.bar-btn.close:hover{background:#FF3B30;color:#fff}
.bar-btn svg{width:15px;height:15px;transition:transform .15s}
body.collapsed #btnMin svg{transform:rotate(180deg)}

/* ===== 搜索 ===== */
.srch-wrap{padding:8px 12px 6px;position:relative}
.srch-ic{
  position:absolute;left:20px;top:50%;transform:translateY(-50%);
  width:14px;height:14px;color:var(--text-tertiary);pointer-events:none;
}
.srch{
  width:100%;padding:8px 10px 8px 32px;font-size:12px;
  background:var(--bg-panel);border:1px solid var(--border-strong);
  border-radius:8px;outline:none;color:var(--text-primary);font-family:inherit;
  transition:.15s;
}
.srch::placeholder{color:#8A909C}
[data-theme="dark"] .srch::placeholder{color:#767D8A}
.srch:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}

/* ===== Tab ===== */
.tabs{display:flex;gap:2px;padding:2px 12px 6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:4px 10px;font-size:10.5px;white-space:nowrap;
  background:transparent;border:none;border-radius:999px;
  cursor:pointer;color:var(--text-secondary);transition:.12s;font-family:inherit;
  font-weight:500;line-height:1.4;
}
.tab:hover{color:var(--text-primary)}
.tab.on{background:var(--accent);color:#fff}
.tab .cnt{color:var(--text-tertiary);margin-left:2px;font-weight:400;font-size:10px}
.tab.on .cnt{color:rgba(255,255,255,.75)}

/* ===== 开关 ===== */
.switch{display:flex;align-items:center;gap:8px;padding:4px 12px 6px;cursor:pointer;user-select:none}
.sw{
  position:relative;width:30px;height:16px;background:rgba(16,18,29,.15);
  border-radius:999px;transition:.2s;flex-shrink:0;
}
[data-theme="dark"] .sw{background:rgba(255,255,255,.15)}
.sw.on{background:var(--accent)}
.sw::after{
  content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;
  background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s;
}
.sw.on::after{left:16px}
.sw-text{font-size:11px;color:var(--text-secondary);flex:1;line-height:1.4}

/* ===== 列表 ===== */
.list{flex:1;overflow-y:auto;scrollbar-width:thin;padding:0 12px 8px}
.list::-webkit-scrollbar{width:4px}
.list::-webkit-scrollbar-thumb{background:rgba(16,18,29,.12);border-radius:2px}
[data-theme="dark"] .list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15)}

.grp{
  position:sticky;top:0;z-index:2;
  font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--text-tertiary);
  padding:8px 2px 4px;text-transform:uppercase;
  background:var(--bg-panel);
}
.grp-btn{
  width:100%;display:flex;align-items:center;gap:4px;
  border:none;cursor:pointer;font-family:inherit;text-align:left;
}
.grp-btn .caret{display:inline-flex;transition:transform .15s}
.grp-btn .caret svg{width:11px;height:11px}
.grp-btn.open .caret{transform:rotate(90deg)}
.grp-btn .cnt{color:var(--text-tertiary);font-weight:400;letter-spacing:0;text-transform:none}

.card{
  background:var(--bg-panel);border:1px solid var(--border);
  border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer;
  transition:.15s cubic-bezier(.2,.8,.2,1);
}
.card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--hover-shadow)}
.card.open{border-color:var(--accent);background:rgba(61,107,255,.02)}
[data-theme="dark"] .card.open{background:rgba(110,139,255,.05)}
.card.sg{border-style:dashed}
.card.sg:hover{border-style:solid}

.card-top{display:flex;align-items:center;gap:8px}
.ic{
  width:22px;height:22px;border-radius:6px;flex-shrink:0;
  background:var(--accent-bg);
  display:flex;align-items:center;justify-content:center;color:var(--accent);
}
.ic svg{width:14px;height:14px}
.nm{flex:1;font-weight:600;font-size:13px;letter-spacing:-.01em;word-break:break-all}
.badge{font-size:10px;padding:2px 7px;border-radius:999px;font-weight:500;flex-shrink:0}
.badge.ok{background:var(--success-bg);color:var(--success)}
.badge.src{background:rgba(16,18,29,.05);color:var(--text-tertiary)}
[data-theme="dark"] .badge.src{background:rgba(255,255,255,.08)}
.badge.sg{background:rgba(16,18,29,.05);color:var(--text-tertiary)}
[data-theme="dark"] .badge.sg{background:rgba(255,255,255,.08)}

.ds{
  font-size:12px;color:var(--text-secondary);margin-top:4px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.rsn{font-size:10.5px;color:var(--text-tertiary);margin-top:4px;line-height:1.4}

.detail{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);display:none}
.card.open .detail{display:block}

.sec{font-size:10.5px;font-weight:600;color:var(--text-tertiary);margin:4px 0 3px;letter-spacing:.04em;text-transform:uppercase}
.sec:first-child{margin-top:0}

.p-row{
  position:relative;padding:6px 28px 6px 10px;
  background:var(--accent-bg);border:1px solid transparent;border-radius:6px;
  font-size:11.5px;line-height:1.45;margin-bottom:4px;cursor:pointer;
  font-family:"SF Mono","Cascadia Code","JetBrains Mono",Consolas,monospace;
  color:var(--text-primary);transition:.12s;word-break:break-all;
}
.p-row:hover{border-color:var(--accent)}
.p-ic{display:inline-flex;vertical-align:-2px;margin-right:5px;color:var(--accent)}
.p-ic svg{width:12px;height:12px}
.p-row .cp{
  position:absolute;top:4px;right:4px;width:18px;height:18px;border:none;
  background:var(--bg-panel);border:1px solid var(--border);border-radius:4px;
  cursor:pointer;opacity:0;transition:.12s;
  display:flex;align-items:center;justify-content:center;color:var(--text-secondary);
}
.p-row .cp svg{width:11px;height:11px}
.p-row:hover .cp{opacity:1}

.tip{display:flex;gap:6px;align-items:flex-start;font-size:11px;color:var(--text-secondary);line-height:1.45}
.tip-ic{color:var(--accent);flex-shrink:0;margin-top:1px;display:inline-flex}
.tip-ic svg{width:11px;height:11px}

/* ===== 状态栏 ===== */
.st{
  padding:8px 12px;border-top:1px solid var(--border);
  font-size:10.5px;color:var(--text-tertiary);
  display:flex;justify-content:space-between;flex-shrink:0;
}

/* ===== 空状态 / 错误 ===== */
.empty{padding:44px 20px;text-align:center}
.empty-svg{color:var(--text-tertiary);margin-bottom:12px}
.empty-title{font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:4px}
.empty-sub{font-size:11.5px;color:var(--text-secondary);line-height:1.5;margin-bottom:16px}
.empty-btn{
  padding:7px 16px;font-size:11.5px;font-weight:500;font-family:inherit;
  background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;transition:.12s;
}
.empty-btn:hover{opacity:.9}
.err{padding:40px 20px;text-align:center}
.err-title{font-size:13px;font-weight:600;color:#FF3B30;margin-bottom:6px}
.err-msg{font-size:11px;color:var(--text-secondary);font-family:monospace;background:rgba(255,59,48,.06);padding:8px 10px;border-radius:6px;text-align:left;word-break:break-all;margin-top:10px}

/* ===== 折叠态 ===== */
body.collapsed .srch-wrap,body.collapsed .tabs,body.collapsed .switch,body.collapsed .list,body.collapsed .st{display:none}
body.collapsed .bar{border-bottom:none}

/* ===== 无障碍 ===== */
.card:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.p-row:focus-visible,.cp:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:999px}
.srch:focus-visible{outline:none}
.switch:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
.bar-btn.spin svg{animation:hudSpin .6s linear}
@keyframes hudSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <div class="bar" role="titlebar">
    <svg class="bar-logo" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <div class="bar-title">SkillHUD</div>
    <div class="bar-btns">
      <button class="bar-btn" id="btnRefresh" title="重新扫描" aria-label="重新扫描"></button>
      <button class="bar-btn" id="btnTheme" title="切换主题" aria-label="切换主题"></button>
      <button class="bar-btn" id="btnTop" title="置顶" aria-label="置顶"></button>
      <button class="bar-btn" id="btnMin" title="折叠" aria-label="折叠"></button>
      <button class="bar-btn" id="btnMinimize" title="最小化" aria-label="最小化"></button>
      <button class="bar-btn close" id="btnClose" title="关闭" aria-label="关闭"></button>
    </div>
  </div>
  <div class="srch-wrap" id="srchWrap"></div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="switch" id="swRow" role="switch" aria-checked="false" tabindex="0">
    <div class="sw" id="swAll"></div>
    <div class="sw-text" id="swText">只显示实用工具（隐藏飞书/企微平台型）</div>
  </div>
  <div class="list" id="list"></div>
  <div class="st" id="stBar">
    <span id="stInfo">本地清单 · <span id="totalCount">0</span> 项</span>
    <span id="visibleCount">显示 0</span>
  </div>
</div>

<script>
(function(){
  // ===== 内联 SVG 图标（功能图标一律用 SVG，不用 emoji）=====
  const ICON = {
    avatar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>',
    chart:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3v18h18"/><path d="M7 15l4-4 4 3 5-6"/></svg>',
    wrench: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14.7 6.3a5 5 0 0 0-6.9 6.9L3 18l3 3 4.8-4.8a5 5 0 0 0 6.9-6.9"/><path d="M14.7 6.3l3 3"/></svg>',
    globe:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>',
    link:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>',
    github: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.4-3.4-1.4-.5-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.6 2.4 1.1 3 .8.1-.6.3-1.1.6-1.4-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.5-1.3.1-2.6 0 0 .8-.3 2.7 1a9.4 9.4 0 0 1 5 0c1.9-1.3 2.7-1 2.7-1 .6 1.3.2 2.3.1 2.6.7.7 1 1.6 1 2.7 0 3.9-2.4 4.7-4.6 5 .4.3.7.9.7 1.8v2.7c0 .3.2.6.7.5A10 10 0 0 0 12 2z"/></svg>',
    chat:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
    bug:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 9a6 6 0 0 0-6 6v3h12v-3a6 6 0 0 0-6-6"/><path d="M12 9V6M8 4l2 2M16 4l-2 2M4 12h2M18 12h2M4 18h2M18 18h2"/></svg>',
    rocket: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4.5 16.5c-1.5 1.3-2 5-2 5s3.7-.5 5-2c.8-1 .8-2.5 0-3.3s-2.3-.8-3 0z"/><path d="M12 15l-3-3"/><path d="M15 14a6 6 0 0 0-6-6 14 14 0 0 1 4-3.5A11 11 0 0 1 21 11a14 14 0 0 1-3.5 4 6 6 0 0 0-2.5-1z"/></svg>',
    graph:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3v18h18"/><path d="M7 12l4-4 4 3 5-7"/></svg>',
    dollar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
    data:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>',
    screen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
    lark:   '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 1 6 3.5L12 12 6 5.5A7 7 0 0 1 12 2z"/><path d="M6 10l6 6-6 6a7 7 0 0 1 0-12z"/><path d="M18 10a7 7 0 0 1 0 12l-6-6z"/></svg>',
    wecom:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 4h8a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-2l-4 3v-3H8a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4z"/></svg>',
    sparkle:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2 7 7 2-7 2-2 7-2-7-7-2 7-2z"/></svg>',
    book:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v18H6.5A2.5 2.5 0 0 0 4 22z"/><path d="M4 4.5V19"/></svg>',
    doc:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M8 13h8M8 17h5"/></svg>',
    mail:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
    copy:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
    check:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 12l5 5L20 6"/></svg>',
    bulb:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.5.4.8 1 .8 1.6V16h5.4v-.5c0-.6.3-1.2.8-1.6A6 6 0 0 0 12 3z"/></svg>',
    caret:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>',
    sun:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>',
    moon:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 14.5A8 8 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5z"/></svg>',
    pin:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3l6 6h-4v12h-4V9H6z"/></svg>',
    chevU:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 15l6-6 6 6"/></svg>',
    dash:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 12h12"/></svg>',
    x:      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>',
  };

  // 分类 → 图标兜底（skills.json 没给 icon 时用）
  const CAT_ICON = {
    '创作':'avatar','界面':'chart','开发':'wrench','浏览器':'globe','GitHub':'github',
    '金融':'graph','演示':'screen','飞书':'lark','企业微信':'wecom','公考':'book',
    '写作':'doc','效率':'mail','工具':'sparkle','其他':'sparkle',
  };

  const api = window.skillhud || { send:()=>{}, on:()=>{}, scan:null };
  const $ = id => document.getElementById(id);

  function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]); }
  function escA(s){ return esc(s).replace(/"/g,'&quot;'); }
  function iconOf(s){
    if(s.icon && ICON[s.icon]) return ICON[s.icon];
    return ICON[CAT_ICON[s.category]] || ICON.sparkle;
  }
  function iconBtn(id, iconKey, title){
    const el = $(id);
    if(el){ el.innerHTML = ICON[iconKey]; el.title = title; el.setAttribute('aria-label', title); }
  }

  function showError(err){
    const list = $('list');
    if(list) list.innerHTML = `<div class="err"><div class="err-title">加载失败</div><div class="err-msg">${esc(err && err.message || err)}</div></div>`;
    const info = $('stInfo');
    if(info) info.textContent = '加载出错';
    console.error(err);
  }

  // ===== 数据加载：优先真实扫描，失败再退化为只读 overlay =====
  async function loadData(){
    if(typeof api.scan === 'function'){
      try{
        const d = await api.scan();
        if(d && Array.isArray(d.skills)) return d;
      }catch(e){ console.error('scan failed', e); }
    }
    try{
      const r = await fetch('skills.json');
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      return {
        skills: (j.skills||[]).map(s=>({
          name:s.name, description:s.description||'', category:s.category||'其他',
          icon:s.icon||'', prompts:s.prompts||[], tips:s.tips||[], source:'overlay',
        })),
        suggested: j.suggested||[], offline:true,
      };
    }catch(e){
      return null;
    }
  }

  async function runApp(){
    // 顶栏图标
    iconBtn('btnRefresh', 'refresh', '重新扫描');
    iconBtn('btnTheme', 'sun', '切换主题');
    iconBtn('btnTop', 'pin', '置顶');
    iconBtn('btnMin', 'chevU', '折叠');
    iconBtn('btnMinimize', 'dash', '最小化');
    iconBtn('btnClose', 'x', '关闭');
    $('srchWrap').innerHTML = `<span class="srch-ic">${ICON.search}</span><input class="srch" id="srch" placeholder="搜索 Skill 名称、描述或触发词…" aria-label="搜索" />`;
    $('btnClose').onclick = ()=> api.send('close-window');
    $('btnMinimize').onclick = ()=> api.send('minimize-window');
    $('btnMin').onclick = ()=> api.send('toggle-collapse');
    $('btnTop').onclick = ()=> api.send('toggle-top');

    // 重新扫描：常驻按钮手动触发；窗口重新获得焦点时自动比对，有变化才重渲染
    let doRescan = null;                 // 成功加载后注入；失败态退化为整页刷新
    $('btnRefresh').onclick = ()=>{ if(doRescan) doRescan(true); else location.reload(); };
    window.addEventListener('focus', ()=>{ if(doRescan) doRescan(false); });

    // 主题：先按本地存储应用，避免首屏闪白，再同步给主进程存窗口底色
    const savedTheme = localStorage.getItem('skillhud_theme') === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    api.send('theme', savedTheme);
    $('btnTheme').onclick = ()=>{
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('skillhud_theme', next);
      $('btnTheme').innerHTML = next === 'dark' ? ICON.moon : ICON.sun;
      api.send('theme', next);
    };
    $('btnTheme').innerHTML = savedTheme === 'dark' ? ICON.moon : ICON.sun;

    const data = await loadData();
    if(!data){
      $('list').innerHTML =
        `<div class="empty">
          <div class="empty-svg">${ICON.globe}</div>
          <div class="empty-title">没有拿到 Skill 数据</div>
          <div class="empty-sub">扫描接口未就绪，且无法读取本地 overlay。<br>请用 <code>npm start</code> 通过 Electron 启动。</div>
          <button class="empty-btn" id="btnRescan">重新扫描</button>
        </div>`;
      $('stInfo').textContent = '未连接扫描接口';
      $('visibleCount').textContent = '';
      $('list').onclick = e=>{ if(e.target.closest('#btnRescan')) location.reload(); };
      return;
    }

    let ALL = data.skills;
    let SUGGESTED = data.suggested || [];
    let OFFLINE = !!data.offline;

    let showPF = localStorage.getItem('skillhud_pf') === '1';
    let activeCat = 'all', q = '', showSuggest = false;
    const open = new Set();

    const srch = $('srch'), tabs = $('tabs'), list = $('list');
    const swRow = $('swRow'), swAll = $('swAll'), swText = $('swText');

    const isPF = s => s.category === '飞书' || s.category === '企业微信';
    const basePool = ()=> showPF ? ALL.slice() : ALL.filter(s=>!isPF(s));
    const match = s => ((s.name||'')+' '+(s.description||'')+' '+(s.category||'')+' '+(s.prompts||[]).join(' ')).toLowerCase().includes(q);

    function buildTabs(pool){
      const cats = [...new Set(pool.map(s=>s.category))].sort((a,b)=>a.localeCompare(b,'zh'));
      tabs.innerHTML =
        `<button class="tab${activeCat==='all'?' on':''}" data-c="all" role="tab">全部<span class="cnt">${pool.length}</span></button>` +
        cats.map(c=>`<button class="tab${activeCat===c?' on':''}" data-c="${escA(c)}" role="tab">${esc(c)}<span class="cnt">${pool.filter(s=>s.category===c).length}</span></button>`).join('');
    }
    tabs.onclick = e=>{
      const b = e.target.closest('.tab');
      if(!b) return;
      activeCat = b.dataset.c;
      tabs.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t===b));
      render();
    };

    function cardHTML(s, opts){
      const sg = opts && opts.suggested;
      const key = (sg?'sg:':'') + s.name;
      const isOpen = open.has(key);
      const prompts = (s.prompts||[]).map(p=>
        `<div class="p-row" data-t="${escA(p)}" tabindex="0" role="button" aria-label="复制触发词">
           <span class="p-ic">${ICON.chat}</span>${esc(p)}
           <button class="cp" aria-label="复制">${ICON.copy}</button>
         </div>`).join('');
      const tips = (s.tips||[]).map(t=>`<div class="tip"><span class="tip-ic">${ICON.bulb}</span><span>${esc(t)}</span></div>`).join('');
      const badge = sg
        ? '<span class="badge sg">推荐</span>'
        : (s.source ? `<span class="badge src">${esc(s.source)}</span>` : '<span class="badge ok">已装</span>');
      return `<div class="card${sg?' sg':''}${isOpen?' open':''}" data-k="${escA(key)}" tabindex="0" role="button" aria-expanded="${isOpen}">
        <div class="card-top">
          <div class="ic">${iconOf(s)}</div>
          <div class="nm">${esc(s.name)}</div>
          ${badge}
        </div>
        <div class="ds">${esc(s.description||'')}</div>
        ${sg && s._reason ? `<div class="rsn">${esc(s._reason)}</div>` : ''}
        <div class="detail">
          ${prompts?`<div class="sec">触发词（点击复制）</div>${prompts}`:''}
          ${tips?`<div class="sec">使用贴士</div>${tips}`:''}
        </div>
      </div>`;
    }

    function render(){
      const pool = basePool();
      let f = activeCat === 'all' ? pool.slice() : pool.filter(s=>s.category===activeCat);
      if(q) f = f.filter(match);

      $('stInfo').innerHTML = (OFFLINE ? '离线预览（仅 overlay）' : '本地清单') + ' · <span id="totalCount">' + ALL.length + '</span> 项';
      $('visibleCount').textContent = '显示 ' + f.length;
      buildTabs(pool);

      if(!f.length){
        list.innerHTML =
          `<div class="empty">
            <div class="empty-svg">${ICON.search}</div>
            <div class="empty-title">没有匹配的 Skill</div>
            <div class="empty-sub">换个关键词，或者点上面的分类试试</div>
            <button class="empty-btn" id="btnClear">清空搜索</button>
          </div>`;
        return;
      }

      const groups = {};
      f.forEach(s=>((groups[s.category] = groups[s.category] || []).push(s)));
      let h = '';
      Object.keys(groups).sort((a,b)=>a.localeCompare(b,'zh')).forEach(cat=>{
        h += `<div class="grp" role="heading" aria-level="3">${esc(cat)}</div>`;
        groups[cat].sort((a,b)=>a.name.localeCompare(b.name,'zh')).forEach(s=>{ h += cardHTML(s); });
      });

      if(activeCat === 'all' && !q && SUGGESTED.length){
        h += `<button class="grp grp-btn${showSuggest?' open':''}" id="sgToggle" aria-expanded="${showSuggest}">
          <span class="caret">${ICON.caret}</span>未安装 / 推荐 <span class="cnt">${SUGGESTED.length}</span>
        </button>`;
        if(showSuggest){
          SUGGESTED.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name),'zh'))
            .forEach(s=>{ h += cardHTML(s, { suggested:true }); });
        }
      }
      list.innerHTML = h;
    }

    function toggleCard(card){
      const key = card.dataset.k;
      if(!key) return;
      const now = open.has(key);
      if(now) open.delete(key); else open.add(key);
      card.classList.toggle('open', !now);
      card.setAttribute('aria-expanded', String(!now));
    }

    function copyText(row, btn){
      const text = row.dataset.t;
      const done = ()=>{
        if(btn){ btn.innerHTML = ICON.check; setTimeout(()=>{ btn.innerHTML = ICON.copy; }, 1000); }
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
      } else {
        fallbackCopy(text, done);
      }
    }
    function fallbackCopy(text, done){
      try{
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta); done();
      }catch(e){ console.error(e); }
    }

    list.onclick = e=>{
      if(e.target.closest('#btnClear')){ q=''; srch.value=''; activeCat='all'; render(); return; }
      if(e.target.closest('#sgToggle')){ showSuggest = !showSuggest; render(); return; }
      const row = e.target.closest('.p-row');
      if(row){ copyText(row, row.querySelector('.cp')); return; }
      const card = e.target.closest('.card');
      if(card){ toggleCard(card); }
    };
    list.onkeydown = e=>{
      if(e.key !== 'Enter' && e.key !== ' ') return;
      const row = e.target.closest('.p-row');
      if(row){ e.preventDefault(); copyText(row, row.querySelector('.cp')); return; }
      const toggle = e.target.closest('#sgToggle');
      if(toggle){ e.preventDefault(); showSuggest = !showSuggest; render(); return; }
      const card = e.target.closest('.card');
      if(card){ e.preventDefault(); toggleCard(card); }
    };

    srch.oninput = e=>{ q = (e.target.value||'').toLowerCase(); render(); };
    srch.onkeydown = e=>{ if(e.key === 'Escape'){ q=''; srch.value=''; render(); } };

    function togglePF(){
      showPF = !showPF;
      localStorage.setItem('skillhud_pf', showPF ? '1' : '0');
      swAll.classList.toggle('on', showPF);
      swRow.setAttribute('aria-checked', String(showPF));
      swText.textContent = showPF ? '已显示全部（含飞书/企微）' : '只显示实用工具（隐藏飞书/企微平台型）';
      if(activeCat !== 'all' && !basePool().some(s=>s.category === activeCat)) activeCat = 'all';
      render();
    }
    swRow.onclick = togglePF;
    swRow.onkeydown = e=>{ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); togglePF(); } };

    swAll.classList.toggle('on', showPF);
    swRow.setAttribute('aria-checked', String(showPF));
    swText.textContent = showPF ? '已显示全部（含飞书/企微）' : '只显示实用工具（隐藏飞书/企微平台型）';

    // 折叠 / 置顶状态（主进程回推）
    if(api.on){
      api.on('collapsed-state', v=>{
        document.body.classList.toggle('collapsed', v);
        document.documentElement.style.height = v ? '34px' : '';
        const b = $('btnMin');
        b.title = v ? '展开' : '折叠';
        b.setAttribute('aria-label', b.title);
      });
      api.on('top-state', v=>{
        const b = $('btnTop');
        b.style.color = v ? 'var(--accent)' : '';
        b.title = v ? '已置顶（点击取消）' : '置顶';
        b.setAttribute('aria-label', b.title);
        b.setAttribute('aria-pressed', String(v));
      });
    }

    // ===== 重新扫描：常驻按钮手动触发 / 焦点回归时自动比对 =====
    const dataSig = d => (d.skills||[]).map(s=>s.name).join('\u0001') + '\u0002' + (d.suggested||[]).length + (d.offline ? '\u0003' : '');
    let curSig = dataSig(data), lastScanAt = 0, scanning = false;
    function spinRefresh(){
      const b = $('btnRefresh');
      b.classList.remove('spin');
      void b.offsetWidth;                       // 强制回流，让动画可重播
      b.classList.add('spin');
      setTimeout(()=>b.classList.remove('spin'), 650);
    }
    doRescan = async function(manual){
      if(scanning) return;
      const now = Date.now();
      if(!manual && now - lastScanAt < 1500) return;   // 焦点抖动防抖
      if(manual) spinRefresh();
      scanning = true; lastScanAt = now;
      try{
        const d = await loadData();
        if(!d) return;
        const s = dataSig(d);
        if(!manual && s === curSig) return;            // 无变化不重渲染，避免闪烁
        ALL = d.skills; SUGGESTED = d.suggested || []; OFFLINE = !!d.offline; curSig = s;
        if(activeCat !== 'all' && !ALL.some(x=>x.category === activeCat)) activeCat = 'all';
        render();
      }catch(e){
        console.error('rescan failed', e);
      }finally{
        scanning = false;
      }
    };

    render();
  }

  // 统一出口：任何同步/异步异常都落到错误态，杜绝白屏
  runApp().catch(showError);
})();
</script>
