<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>SkillHUD</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden}

:root{
  --bg-window:#F4F5F7;
  --bg-panel:#FFFFFF;
  --text-primary:#16181D;
  --text-secondary:#5B616E;
  --text-tertiary:#8A909C;
  --accent:#3D6BFF;
  --accent-bg:rgba(61,107,255,.10);
  --success:#12A150;
  --success-bg:rgba(18,161,80,.12);
  --border:rgba(16,18,29,.08);
  --border-strong:rgba(16,18,29,.12);
  --hover-shadow:0 2px 8px rgba(16,18,29,.08);
}
[data-theme="dark"]{
  --bg-window:#101216;
  --bg-panel:#1B1E24;
  --text-primary:#E8EAEE;
  --text-secondary:#A6ADBB;
  --text-tertiary:#767D8A;
  --accent:#6E8BFF;
  --accent-bg:rgba(110,139,255,.14);
  --success:#12A150;
  --success-bg:rgba(18,161,80,.15);
  --border:rgba(255,255,255,.08);
  --border-strong:rgba(255,255,255,.12);
  --hover-shadow:0 2px 8px rgba(0,0,0,.35);
}

body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  background:var(--bg-window);color:var(--text-primary);
  display:flex;height:100%;
}

/* ===== 容器 ===== */
.app{
  flex:1;display:flex;flex-direction:column;
  margin:0;background:var(--bg-panel);
  overflow:hidden;
}

/* ===== 顶栏 ===== */
.bar{
  height:34px;flex-shrink:0;
  display:flex;align-items:center;padding:0 8px 0 12px;gap:6px;
  border-bottom:1px solid var(--border);
  background:var(--bg-panel);
  -webkit-app-region:drag;
}
.bar-title{
  flex:1;font-weight:600;font-size:12.5px;color:var(--text-primary);
  letter-spacing:-.01em;
}
.bar-btns{display:flex;gap:2px;-webkit-app-region:no-drag}
.bar-btn{
  width:26px;height:26px;border:none;background:transparent;
  border-radius:8px;cursor:pointer;color:var(--text-tertiary);
  display:flex;align-items:center;justify-content:center;
  transition:.12s;
}
.bar-btn:hover{background:rgba(16,18,29,.06);color:var(--text-primary)}
[data-theme="dark"] .bar-btn:hover{background:rgba(255,255,255,.08)}
.bar-btn.close:hover{background:#FF3B30;color:#fff}
.bar-btn svg{width:15px;height:15px;transition:transform .15s}
body.collapsed #btnMin svg{transform:rotate(180deg)}

/* ===== 搜索 ===== */
.srch-wrap{padding:8px 12px 6px;position:relative}
.srch-wrap::before{
  content:"";position:absolute;left:19px;top:50%;transform:translateY(-40%);
  width:14px;height:14px;color:var(--text-tertiary);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.5'><circle cx='11' cy='11' r='7'/><path d='m20 20-3.5-3.5'/></svg>");
  background-size:contain;background-repeat:no-repeat;opacity:.55;pointer-events:none;
}
.srch{
  width:100%;padding:8px 10px 8px 32px;font-size:12px;
  background:var(--bg-panel);border:1px solid var(--border-strong);
  border-radius:8px;outline:none;color:var(--text-primary);font-family:inherit;
  transition:.15s;
}
.srch::placeholder{color:#8A909C}
[data-theme="dark"] .srch::placeholder{color:#767D8A}
.srch:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}

/* ===== Tab ===== */
.tabs{display:flex;gap:2px;padding:2px 12px 6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:4px 10px;font-size:10.5px;white-space:nowrap;
  background:transparent;border:none;border-radius:999px;
  cursor:pointer;color:var(--text-secondary);transition:.12s;font-family:inherit;
  font-weight:500;line-height:1.4;
}
.tab:hover{color:var(--text-primary)}
.tab.on{background:var(--accent);color:#fff}
.tab .cnt{color:var(--text-tertiary);margin-left:2px;font-weight:400;font-size:10px}
.tab.on .cnt{color:rgba(255,255,255,.75)}

/* ===== 开关 ===== */
.switch{
  display:flex;align-items:center;gap:8px;padding:4px 12px 6px;cursor:pointer;user-select:none;
}
.sw{
  position:relative;width:30px;height:16px;background:rgba(16,18,29,.15);
  border-radius:999px;transition:.2s;flex-shrink:0;
}
[data-theme="dark"] .sw{background:rgba(255,255,255,.15)}
.sw.on{background:var(--accent)}
.sw::after{
  content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;
  background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s;
}
.sw.on::after{left:16px}
.sw-text{font-size:11px;color:var(--text-secondary);flex:1;line-height:1.4}

/* ===== 列表 ===== */
.list{
  flex:1;overflow-y:auto;scrollbar-width:thin;padding:0 12px 8px;
}
.list::-webkit-scrollbar{width:4px}
.list::-webkit-scrollbar-thumb{background:rgba(16,18,29,.12);border-radius:2px}
[data-theme="dark"] .list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15)}

.grp{
  position:sticky;top:0;z-index:2;
  font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--text-tertiary);
  padding:8px 2px 4px;text-transform:uppercase;
  background:var(--bg-panel);
}

.card{
  background:var(--bg-panel);border:1px solid var(--border);
  border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer;
  transition:.15s cubic-bezier(.2,.8,.2,1);
}
.card:hover{
  border-color:var(--accent);
  transform:translateY(-1px);box-shadow:var(--hover-shadow);
}
.card.open{border-color:var(--accent);background:rgba(61,107,255,.02)}
[data-theme="dark"] .card.open{background:rgba(110,139,255,.05)}

.card-top{display:flex;align-items:center;gap:8px}
.ic{
  width:22px;height:22px;border-radius:6px;flex-shrink:0;
  background:var(--accent-bg);
  display:flex;align-items:center;justify-content:center;color:var(--accent);
}
.ic svg{width:14px;height:14px}
.nm{flex:1;font-weight:600;font-size:13px;letter-spacing:-.01em}
.badge{
  font-size:10px;padding:2px 7px;border-radius:999px;font-weight:500;
}
.badge.ok{background:var(--success-bg);color:var(--success)}
.badge.pf{background:rgba(16,18,29,.05);color:var(--text-tertiary)}
[data-theme="dark"] .badge.pf{background:rgba(255,255,255,.08)}

.ds{
  font-size:12px;color:var(--text-secondary);margin-top:4px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}

.detail{
  margin-top:8px;padding-top:8px;
  border-top:1px dashed var(--border);
  display:none;
}
.card.open .detail{display:block}

.sec{
  font-size:10.5px;font-weight:600;color:var(--text-tertiary);
  margin:4px 0 3px;letter-spacing:.04em;text-transform:uppercase;
}
.sec:first-child{margin-top:0}

.p-row{
  position:relative;padding:6px 28px 6px 10px;
  background:var(--accent-bg);border:1px solid transparent;border-radius:6px;
  font-size:11.5px;line-height:1.45;margin-bottom:4px;cursor:pointer;
  font-family:"SF Mono","Cascadia Code","JetBrains Mono",Consolas,monospace;
  color:var(--text-primary);
  transition:.12s;word-break:break-all;
}
.p-row:hover{border-color:var(--accent)}
.p-row .cp{
  position:absolute;top:4px;right:4px;width:18px;height:18px;border:none;
  background:var(--bg-panel);border:1px solid var(--border);border-radius:4px;
  cursor:pointer;font-size:9px;opacity:0;transition:.12s;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-secondary);
}
.p-row:hover .cp{opacity:1}

.tip{font-size:11px;color:var(--text-secondary);line-height:1.45;padding-left:14px;position:relative}
.tip::before{content:"💡";position:absolute;left:0;font-size:9px;top:0}

/* ===== 状态栏 ===== */
.st{
  padding:8px 12px;border-top:1px solid var(--border);
  font-size:10.5px;color:var(--text-tertiary);
  display:flex;justify-content:space-between;flex-shrink:0;
}

/* ===== 空状态 ===== */
.empty{padding:50px 20px;text-align:center}
.empty-svg{color:var(--text-tertiary);margin-bottom:12px}
.empty-title{font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:4px}
.empty-sub{font-size:11.5px;color:var(--text-secondary);line-height:1.5;margin-bottom:16px}
.empty-btn{
  padding:7px 16px;font-size:11.5px;font-weight:500;font-family:inherit;
  background:var(--accent);color:#fff;border:none;border-radius:8px;
  cursor:pointer;transition:.12s;
}
.empty-btn:hover{opacity:.9}

/* ===== 错误兜底 ===== */
.err{padding:40px 20px;text-align:center}
.err-title{font-size:13px;font-weight:600;color:#FF3B30;margin-bottom:6px}
.err-msg{font-size:11px;color:var(--text-secondary);font-family:monospace;background:rgba(255,59,48,.06);padding:8px 10px;border-radius:6px;text-align:left;word-break:break-all;margin-top:10px}

/* ===== 折叠态 ===== */
body.collapsed .srch-wrap, body.collapsed .tabs, body.collapsed .switch, body.collapsed .list, body.collapsed .st{display:none}
body.collapsed .bar{border-bottom:none}

/* ===== 无障碍 ===== */
.card:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:999px}
.srch:focus-visible{outline:none}
</style>
</head>

    {id:'lark-approval',icon:'lark',cat:'飞书',name:'lark-approval',desc:'审批',_pf:true},
    {id:'lark-whiteboard',icon:'lark',cat:'飞书',name:'lark-whiteboard',desc:'画板',_pf:true},
    {id:'lark-markdown',icon:'lark',cat:'飞书',name:'lark-markdown',desc:'原生 Markdown',_pf:true},
    {id:'lark-okr',icon:'lark',cat:'飞书',name:'lark-okr',desc:'OKR 管理',_pf:true},
    {id:'lark-attendance',icon:'lark',cat:'飞书',name:'lark-attendance',desc:'考勤打卡',_pf:true},
    {id:'lark-event',icon:'lark',cat:'飞书',name:'lark-event',desc:'实时事件订阅',_pf:true},
    {id:'lark-openapi-explorer',icon:'lark',cat:'飞书',name:'lark-openapi-explorer',desc:'原生 OpenAPI 探索',_pf:true},
    {id:'lark-skill-maker',icon:'lark',cat:'飞书',name:'lark-skill-maker',desc:'创建 Lark Skill',_pf:true},
    {id:'lark-workflow-meeting-summary',icon:'lark',cat:'飞书',name:'lark-workflow-meeting-summary',desc:'会议纪要自动整理',_pf:true},
    {id:'lark-workflow-standup-report',icon:'lark',cat:'飞书',name:'lark-workflow-standup-report',desc:'日程 + 待办摘要',_pf:true},
    {id:'wecomcli-calendar',icon:'wecom',cat:'企业微信',name:'wecomcli-calendar',desc:'日程管理',_pf:true},
    {id:'wecomcli-disk',icon:'wecom',cat:'企业微信',name:'wecomcli-disk',desc:'微盘文件',_pf:true},
    {id:'wecomcli-doc',icon:'wecom',cat:'企业微信',name:'wecomcli-doc',desc:'在线文档',_pf:true},
    {id:'wecomcli-email',icon:'wecom',cat:'企业微信',name:'wecomcli-email',desc:'邮件',_pf:true},
    {id:'wecomcli-meeting',icon:'wecom',cat:'企业微信',name:'wecomcli-meeting',desc:'会议管理',_pf:true},
    {id:'wecomcli-message',icon:'wecom',cat:'企业微信',name:'wecomcli-message',desc:'消息发送',_pf:true},
    {id:'wecomcli-sheet',icon:'wecom',cat:'企业微信',name:'wecomcli-sheet',desc:'电子表格',_pf:true},
    {id:'wecomcli-smartpage',icon:'wecom',cat:'企业微信',name:'wecomcli-smartpage',desc:'智能文档主页',_pf:true},
    {id:'wecomcli-smartsheet',icon:'wecom',cat:'企业微信',name:'wecomcli-smartsheet',desc:'智能表格',_pf:true},
    {id:'wecomcli-todo',icon:'wecom',cat:'企业微信',name:'wecomcli-todo',desc:'待办任务',_pf:true},
  ];

  // ====== try/catch 兜底 ======
  try{
    runApp();
  }catch(err){
    document.getElementById('list').innerHTML =
      `<div class="err"><div class="err-title">加载失败</div>
       <div class="err-msg">${esc(err.message||err)}</div></div>`;
    document.getElementById('stInfo').textContent = '加载出错';
    console.error(err);
  }

  function runApp(){
    const api = window.skillhud || {send:()=>{}, on:()=>{}};
    document.getElementById('btnClose').onclick = ()=> api.send('close-window');
    document.getElementById('btnMinimize').onclick = ()=> api.send('minimize-window');
    document.getElementById('btnMin').onclick = ()=> api.send('toggle-collapse');
    document.getElementById('btnTop').onclick = ()=> api.send('toggle-top');

    let showPF = localStorage.getItem('skillhud_pf') === '1';
    let activeCat = 'all', q = '', open = new Set();

    const $ = id => document.getElementById(id);
    const srch = $('srch'), tabs = $('tabs'), list = $('list');
    const swAll = $('swAll'), swText = $('swText');

    function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);}
    function escA(s){return esc(s).replace(/"/g,'&quot;');}

    function items(){
      let r = showPF ? ALL.slice() : ALL.filter(s=>!s._pf);
      if(activeCat !== 'all') r = r.filter(s=>s.cat === activeCat);
      if(q) r = r.filter(s => ((s.name||'')+' '+(s.desc||'')+' '+(s.cat||'')+' '+(s.prompts||[]).join(' ')).toLowerCase().includes(q));
      return r;
    }

    function buildTabs(){
      const pool = showPF ? ALL.slice() : ALL.filter(s=>!s._pf);
      const cats = [...new Set(pool.map(s=>s.cat))].sort((a,b)=>a.localeCompare(b,'zh'));
      tabs.innerHTML =
        `<button class="tab on" data-c="all">全部<span class="cnt">${pool.length}</span></button>` +
        cats.map(c=>`<button class="tab" data-c="${escA(c)}">${esc(c)}<span class="cnt">${pool.filter(s=>s.cat===c).length}</span></button>`).join('');
      tabs.querySelectorAll('.tab').forEach(b=>{
        b.onclick = ()=>{ activeCat = b.dataset.c; tabs.querySelectorAll('.tab').forEach(t=>t.classList.remove('on')); b.classList.add('on'); render(); };
        b.setAttribute('role','tab');
      });
    }

    function render(){
      const f = items();
      $('visibleCount').textContent = `显示 ${f.length}`;
      $('totalCount').textContent = ALL.length;

      if(f.length === 0){
        list.innerHTML =
          `<div class="empty">
            <svg class="empty-svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <div class="empty-title">没有匹配的 Skill</div>
            <div class="empty-sub">换个关键词，或者点上面的分类试试</div>
            <button class="empty-btn" id="btnClear">清空搜索</button>
          </div>`;
        const btnClear = document.getElementById('btnClear');
        if(btnClear) btnClear.onclick = ()=>{ q=''; srch.value=''; activeCat='all'; render(); };
        buildTabs(); return;
      }

      const g = {}; f.forEach(s=>((g[s.cat] = g[s.cat] || []).push(s)));
      let h = '';
      Object.keys(g).sort((a,b)=>a.localeCompare(b,'zh')).forEach(cat=>{
        h += `<div class="grp" role="heading" aria-level="3">${esc(cat)}</div>`;
        g[cat].sort((a,b)=>a.name.localeCompare(b.name,'zh')).forEach(s=>{
          const isOpen = open.has(s.id);
          const ps = (s.prompts||[]).map(p=>`<div class="p-row" data-t="${escA(p)}" tabindex="0">💬 ${esc(p)}<button class="cp" aria-label="复制">📋</button></div>`).join('');
          const ts = (s.tips||[]).map(t=>`<div class="tip">${esc(t)}</div>`).join('');
          h += `<div class="card ${isOpen?'open':''}" data-n="${escA(s.id)}" tabindex="0" role="button" aria-expanded="${isOpen}">
            <div class="card-top">
              <div class="ic">${ICON[s.icon]||ICON.sparkle}</div>
              <div class="nm">${esc(s.name)}</div>
              ${s._pf?'<span class="badge pf">平台</span>':'<span class="badge ok">已装</span>'}
            </div>
            <div class="ds">${esc(s.desc||'')}</div>
            <div class="detail">
              ${ps?`<div class="sec">触发词（点击复制）</div>${ps}`:''}
              ${ts?`<div class="sec">使用贴士</div>${ts}`:''}
            </div>
          </div>`;
        });
      });
      list.innerHTML = h;

      list.querySelectorAll('.card').forEach(card=>{
        const id = card.dataset.n;
        if(open.has(id)) card.classList.add('open');
        const toggle = e=>{
          if(e.target.closest('.cp') || e.target.closest('.p-row')) return;
          if(open.has(id)) open.delete(id); else open.add(id);
          card.classList.toggle('open');
          card.setAttribute('aria-expanded', open.has(id));
        };
        card.onclick = toggle;
        card.onkeydown = e=>{ if(e.key==='Enter'||e.key===' ') toggle(e); };
      });
      list.querySelectorAll('.p-row').forEach(p=>{
        const cp = p.querySelector('.cp');
        const clickCp = e=>{
          e.stopPropagation();
          try{
            navigator.clipboard.writeText(p.dataset.t);
            if(cp){ cp.textContent='✓'; setTimeout(()=>cp.textContent='📋',1000); }
          }catch{
            const ta=document.createElement('textarea'); ta.value=p.dataset.t;
            document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
          }
        };
        p.onclick = clickCp;
        cp.onclick = clickCp;
      });
      buildTabs();
    }

    // 事件绑定
    srch.oninput = e=>{ q=(e.target.value||'').toLowerCase(); render(); };
    swAll.onclick = swRowToggle;
    swAll.addEventListener && swAll.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' ') swRowToggle(); });
    $('srch').addEventListener && $('srch').addEventListener('keydown', e=>{ if(e.key==='Escape'){ q=''; srch.value=''; render(); } });
    $('btnTheme').onclick = ()=>{
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur==='dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('skillhud_theme', next);
    };

    function swRowToggle(){
      showPF = !showPF;
      localStorage.setItem('skillhud_pf', showPF?'1':'0');
      swAll.classList.toggle('on', showPF);
      swText.textContent = showPF ? '已显示全部（含飞书/企微）' : '只显示实用工具（默认）';
      $('swRow').setAttribute('aria-checked', showPF?'true':'false');
      render();
    }

    // 初始状态
    swAll.classList.toggle('on', showPF);
    swText.textContent = showPF ? '已显示全部（含飞书/企微）' : '只显示实用工具（隐藏飞书/企微平台型）';
    $('swRow').setAttribute('aria-checked', showPF?'true':'false');
    if(localStorage.getItem('skillhud_theme')==='dark') document.documentElement.setAttribute('data-theme','dark');

    // 折叠态
    api.on && api.on('collapsed-state', v=>{
      document.body.classList.toggle('collapsed', v);
      document.documentElement.style.height = v ? '34px' : '';
      const b = $('btnMin');
      b.title = v ? '展开' : '折叠';
      b.setAttribute('aria-label', b.title);
    });
    api.on && api.on('top-state', v=>{
      const b = $('btnTop');
      b.style.color = v ? 'var(--accent)' : '';
      b.title = v ? '已置顶（点击取消）' : '置顶';
      b.setAttribute('aria-label', b.title);
      b.setAttribute('aria-pressed', v ? 'true' : 'false');
    });

    render();
  }
})();
</script>
</body>
</html>
